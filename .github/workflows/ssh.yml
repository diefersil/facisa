name: 🚀 Deploy WordPress SSH

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy WordPress
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SSH_HOST: facisaunai.edu.br
      SSH_USER: guiaun34
      SSH_PORT: 2222

      # WordPress
      REMOTE_ROOT: /home4/guiaun34/facisaunai.edu.br/

      SSHPASS: ${{ secrets.SSH_PASSWORD }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: 🚚 Baixar repositório
        uses: actions/checkout@v4


      # ==========================================================
      # 2. DEPENDÊNCIAS
      # ==========================================================

      - name: 📦 Instalar Rsync + SSHPass
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rsync \
            sshpass \
            openssh-client


      # ==========================================================
      # 3. SSH
      # ==========================================================

      - name: 🔐 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts


      # ==========================================================
      # 4. PREPARAR ROOT WORDPRESS
      # ==========================================================

      - name: 📦 Preparar Root WordPress
        run: |
          set -e

          rm -rf deploy-root deploy-content
          mkdir -p deploy-root deploy-content/wp-content

          # Allowlist: arquivos e diretórios do WordPress, mais mb.php e tel.php.
          # Não enviar arquivos locais, configuração, .htaccess ou outros PHP da raiz.
          for item in \
            index.php \
            license.txt \
            readme.html \
            wp-*.php \
            wp-admin \
            wp-includes \
            mb.php \
            tel.php; do
            [ -e "$item" ] || continue
            cp -a "$item" deploy-root/
          done

          # Dentro de wp-content, permite somente plugins e themes.
          if [ -d "wp-content/plugins" ]; then cp -a wp-content/plugins deploy-content/wp-content/; fi
          if [ -d "wp-content/themes" ]; then cp -a wp-content/themes deploy-content/wp-content/; fi

          echo ""
          echo "======================================"
          echo "ROOT WORDPRESS PREPARADO"
          echo "======================================"

          find deploy-root deploy-content -type f | sort


      # ==========================================================
      # 5. DEPLOY
      # ==========================================================

      - name: 🚀 Deploy WordPress
        run: |
          set -e

          echo "======================================"
          echo "ABRINDO CONEXÃO SSH"
          echo "======================================"

          conectado=0

          for tentativa in 1 2 3 4 5; do

            echo "Tentativa SSH: $tentativa de 5"

            if sshpass -e \
              ssh \
                -o ControlMaster=no \
                -o ControlPath=none \
                -o ControlPersist=no \
                -p "$SSH_PORT" \
                -o PubkeyAuthentication=no \
                -o PreferredAuthentications=keyboard-interactive,password \
                -o KbdInteractiveAuthentication=yes \
                -o PasswordAuthentication=yes \
                -o NumberOfPasswordPrompts=1 \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=10 \
                "$SSH_USER@$SSH_HOST"
            then
              conectado=1
              break
            fi

            echo "Falha ao conectar."

            espera=$((tentativa * 15))

            echo "Nova tentativa em ${espera}s..."
            sleep "$espera"

          done

          if [ "$conectado" -ne 1 ]; then
            echo "ERRO: NÃO FOI POSSÍVEL CONECTAR VIA SSH"
            exit 1
          fi


          # ======================================================
          # TESTAR SSH
          # ======================================================

          sshpass -e ssh \
            -o ControlMaster=no \
            -o ControlPath=none \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'Servidor SSH OK'"


          # ======================================================
          # CRIAR DIRETÓRIOS WORDPRESS
          # ======================================================

          sshpass -e ssh \
            -o ControlMaster=no \
            -o ControlPath=none \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p \
              '$REMOTE_ROOT' \
              '$REMOTE_ROOT/wp-admin' \
              '$REMOTE_ROOT/wp-includes' \
              '$REMOTE_ROOT/wp-content' \
              '$REMOTE_ROOT/wp-content/themes' \
              '$REMOTE_ROOT/wp-content/languages' \
              '$REMOTE_ROOT/wp-content/plugins' \
              '$REMOTE_ROOT/wp-content/mu-plugins'"


          # ======================================================
          # FUNÇÃO DE DEPLOY
          # ======================================================

          deploy() {

            ORIGEM="$1"
            DESTINO="$2"
            NOME="$3"

            echo ""
            echo "======================================"
            echo "DEPLOY: $NOME"
            echo "======================================"

            rsync \
              -az \
              --partial \
              --exclude='.htaccess' \
              --timeout=600 \
              --info=progress2 \
              --stats \
              -e "sshpass -e ssh \
                -o ControlMaster=no \
                -o ControlPath=none \
                -p $SSH_PORT \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=10" \
              "$ORIGEM" \
              "$SSH_USER@$SSH_HOST:$DESTINO"

            echo ""
            echo "$NOME concluído."
          }


          # Deploy 1: raiz e instalação do WordPress, incluindo wp-admin e wp-includes.
          deploy \
            "./deploy-root/" \
            "$REMOTE_ROOT/" \
            "WORDPRESS CORE E ROOT"

          # Deploy 2: dentro de wp-content, somente plugins e themes.
          deploy \
            "./deploy-content/wp-content/" \
            "$REMOTE_ROOT/wp-content/" \
            "WP-CONTENT (PLUGINS E THEMES)"


          # ======================================================
          # DEPLOY CONCLUÍDO
          # ======================================================

          echo ""
          echo "======================================"
          echo "DEPLOY CONCLUÍDO"
          echo "======================================"

          echo ""
          echo "WORDPRESS:"
          echo "$REMOTE_ROOT"
